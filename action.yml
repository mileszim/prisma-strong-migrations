name: 'Prisma Strong Migrations'
description: 'Lint Prisma migrations for unsafe SQL before it reaches production.'
author: 'Miles Zimmerman'
branding:
  icon: 'database'
  color: 'blue'

inputs:
  migrations-dir:
    description: 'Directory containing Prisma migrations.'
    required: false
    default: './prisma/migrations'
  config:
    description: 'Path to a config file. Auto-discovered when omitted.'
    required: false
    default: ''
  changed-only:
    description: 'Only lint migrations this branch changed versus its base (the whole diff, like a PR — not just the latest commit). The action deepens shallow checkouts automatically.'
    required: false
    default: 'false'
  base:
    description: 'Branch to compare against for changed-only. Defaults to the PR base branch (pull requests) or the repository default branch (pushes).'
    required: false
    default: ''
  fail-on:
    description: "Severity that fails the run: 'error' or 'warning'."
    required: false
    default: 'error'
  reporter:
    description: "Output format: 'github' (inline PR annotations), 'stylish', or 'json'."
    required: false
    default: 'github'
  working-directory:
    description: 'Directory to run in (where the Prisma project lives).'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version used to run the linter.'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build linter
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci
        npm run build

    # Changed-only detection compares the whole branch against the branch it
    # diverged from — the same set of changes a pull request shows, not just the
    # latest commit. That comparison needs a common ancestor (merge base), but the
    # default CI checkout is shallow and has none. So: pick the target branch (the
    # PR base, an explicit base, or the repo default), then deepen history and
    # fetch that branch so the merge base exists.
    - name: Resolve base ref for changed-only
      if: inputs.changed-only == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BASE: ${{ inputs.base }}
      run: |
        # Target branch: explicit input, else the PR base branch, else the
        # repository's default branch (queried from the remote), else "main".
        target="${INPUT_BASE#origin/}"
        if [ -z "$target" ] && [ -n "$GITHUB_BASE_REF" ]; then target="$GITHUB_BASE_REF"; fi
        if [ -z "$target" ]; then
          target="$(git ls-remote --symref origin HEAD 2>/dev/null | sed -n 's#^ref: refs/heads/\(.*\)[[:space:]]HEAD$#\1#p')"
        fi
        if [ -z "$target" ]; then target="main"; fi

        # A shallow checkout hides the common ancestor, making "what did this branch
        # change" impossible to compute. Deepen history, then fetch the target
        # branch in full so a real merge base is available.
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          git fetch --no-tags --unshallow origin 2>/dev/null \
            || git fetch --no-tags --deepen=2147483647 origin 2>/dev/null || true
        fi
        git fetch --no-tags origin "+refs/heads/${target}:refs/remotes/origin/${target}" 2>/dev/null || true

        base="origin/${target}"
        echo "Comparing changed migrations against: $base"
        echo "Merge base with HEAD: $(git merge-base "$base" HEAD 2>/dev/null || echo '(none — comparing branch tips)')"
        echo "PSM_BASE=$base" >> "$GITHUB_ENV"

    - name: Lint migrations
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        args=(lint
          --migrations-dir "${{ inputs.migrations-dir }}"
          --reporter "${{ inputs.reporter }}"
          --fail-on "${{ inputs.fail-on }}")
        if [ -n "${{ inputs.config }}" ]; then
          args+=(--config "${{ inputs.config }}")
        fi
        if [ "${{ inputs.changed-only }}" = "true" ]; then
          args+=(--changed --base "$PSM_BASE")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
