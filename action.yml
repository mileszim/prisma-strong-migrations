name: 'Prisma Strong Migrations'
description: 'Lint Prisma migrations for unsafe SQL before it reaches production.'
author: 'Miles Zimmerman'
branding:
  icon: 'database'
  color: 'blue'

inputs:
  migrations-dir:
    description: 'Directory containing Prisma migrations.'
    required: false
    default: './prisma/migrations'
  config:
    description: 'Path to a config file. Auto-discovered when omitted.'
    required: false
    default: ''
  changed-only:
    description: 'Only lint migrations changed in this event (PR base branch, or the push diff). Use fetch-depth: 0 for the most precise comparison.'
    required: false
    default: 'false'
  base:
    description: 'Base git ref for changed-only. Defaults to the PR base branch on pull requests, or the pre-push commit on pushes.'
    required: false
    default: ''
  fail-on:
    description: "Severity that fails the run: 'error' or 'warning'."
    required: false
    default: 'error'
  reporter:
    description: "Output format: 'github' (inline PR annotations), 'stylish', or 'json'."
    required: false
    default: 'github'
  working-directory:
    description: 'Directory to run in (where the Prisma project lives).'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version used to run the linter.'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build linter
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci
        npm run build

    # Changed-only detection diffs against a base ref. The correct base depends
    # on the event: a pull request compares against its base branch, while a push
    # compares against the commit before the push. Resolve it here and make sure
    # it is present in history (the default checkout is shallow). For the most
    # precise results, check out with fetch-depth: 0.
    - name: Resolve base ref for changed-only
      if: inputs.changed-only == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE: ${{ github.base_ref }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        zero="0000000000000000000000000000000000000000"
        if [ -n "$INPUT_BASE" ]; then
          base="$INPUT_BASE"
          ref="${base#origin/}"
          git fetch --no-tags --depth=1 origin "+refs/heads/${ref}:refs/remotes/origin/${ref}" 2>/dev/null || true
        elif [ -n "$PR_BASE" ]; then
          # Pull request: compare against the PR's base branch.
          base="origin/$PR_BASE"
          git fetch --no-tags --depth=1 origin "+refs/heads/${PR_BASE}:refs/remotes/origin/${PR_BASE}" 2>/dev/null || true
        elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ]; then
          # Push: compare against the commit that was there before the push.
          base="$PUSH_BEFORE"
          git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" 2>/dev/null || true
        else
          # Fallback (e.g. first push to a new branch): compare against main.
          base="origin/main"
          git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main" 2>/dev/null || true
        fi
        echo "Comparing changed migrations against: $base"
        echo "PSM_BASE=$base" >> "$GITHUB_ENV"

    - name: Lint migrations
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        args=(lint
          --migrations-dir "${{ inputs.migrations-dir }}"
          --reporter "${{ inputs.reporter }}"
          --fail-on "${{ inputs.fail-on }}")
        if [ -n "${{ inputs.config }}" ]; then
          args+=(--config "${{ inputs.config }}")
        fi
        if [ "${{ inputs.changed-only }}" = "true" ]; then
          args+=(--changed --base "$PSM_BASE")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
